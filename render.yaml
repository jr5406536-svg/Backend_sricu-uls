databases:
  - name: sricu-db
    plan: free
    databaseName: sricu
    user: sricu

services:
  - type: web
    name: sricu-uls-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: SEMANTIC_SEARCH_ENABLED
        value: "false"
      - key: MAX_UPLOAD_KB
        value: "20480"
      - key: DATABASE_URL
        fromDatabase:
          name: sricu-db
          property: connectionString
